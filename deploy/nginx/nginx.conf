user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 2048; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 # No query strings, referers, cookies, raw user agents or client IPs in access logs.
 log_format operational escape=json '{"request_id":"$request_id","method":"$request_method","status":$status,"bytes":$body_bytes_sent,"duration":$request_time,"upstream_duration":"$upstream_response_time"}';
 access_log /dev/stdout operational;
 sendfile on;
 tcp_nopush on;
 keepalive_timeout 30;
 server_tokens off;
 client_header_timeout 15s;
 client_body_timeout 20s;
 send_timeout 30s;
 limit_req_status 429;
 limit_conn_status 429;
 limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
 limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
 limit_req_zone $binary_remote_addr zone=upload:10m rate=2r/m;
 limit_conn_zone $binary_remote_addr zone=connections:10m;
 gzip on;
 gzip_vary on;
 gzip_min_length 1024;
 gzip_comp_level 5;
 gzip_types text/plain text/css application/json application/javascript image/svg+xml;
 include /etc/nginx/conf.d/*.conf;
}

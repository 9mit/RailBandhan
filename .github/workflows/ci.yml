name: RailBandhan quality gates
on:
  workflow_call: {}
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: { contents: read }
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          {
            POSTGRES_USER: railbandhan,
            POSTGRES_PASSWORD: ci-disposable-only,
            POSTGRES_DB: railbandhan_test,
          }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U railbandhan -d railbandhan_test" --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATA_STORE: sqlite
      POSTGRES_TEST_URL: postgresql://railbandhan:ci-disposable-only@localhost:5432/railbandhan_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          {
            node-version: 24,
            cache: npm,
            cache-dependency-path: apps/web/package-lock.json,
          }
      - name: Install local ticket readers
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
      - name: Install locked dependencies
        run: npm --prefix apps/web ci --no-audit --no-fund
      - name: Apply PostgreSQL migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://railbandhan:ci-disposable-only@localhost:5432/railbandhan_test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Audit runtime and development dependencies
        run: npm audit --prefix apps/web --audit-level=moderate --fetch-timeout=30000 --fetch-retries=1
      - run: npm run preflight
      - name: Production build
        run: npm run build
        env: { NODE_ENV: production, NEXT_TELEMETRY_DISABLED: "1" }
      - name: HTTP smoke checks against the production artifact
        run: node scripts/ci-smoke.mjs
